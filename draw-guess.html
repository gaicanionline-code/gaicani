<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>GAICANI – დახატე და გამოიცანი</title>
  <meta name="theme-color" content="#17181d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #17181d;
      --surface:   #26272e;
      --surface-2: #2f3037;
      --border:    rgba(255,255,255,0.08);
      --accent:    #5865f2;
      --accent-lt: #8b93ff;
      --text:      #e4e5ea;
      --muted:     #7d81a0;
      --good:      #3ba55d;
      --warn:      #faa61a;
      --danger:    #f23f42;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%; height: 100dvh;
      height: var(--app-height, 100dvh);
      background: radial-gradient(circle at 50% 0%, #22232c 0%, #17181d 55%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    #app { display: flex; flex-direction: column; height: 100%; height: 100dvh; height: var(--app-height, 100dvh); }

    .dg-loading, .dg-center-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 14px; text-align: center; padding: 24px;
    }
    .dg-loading.hidden, .dg-center-screen.hidden { display: none; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent-lt);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .dg-center-screen a { color: var(--accent-lt); text-decoration: none; font-weight: 600; }

    .dg-screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .dg-screen.visible { display: flex; }

    .dg-header {
      display: flex; align-items: center; gap: 10px;
      height: 54px; flex-shrink: 0; padding: 0 14px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .dg-back { color: var(--text); text-decoration: none; font-size: 1.3em; opacity: 0.85; padding: 4px; }
    .dg-title { font-weight: 700; font-size: 1.02em; }

    /* ── Setup screen (friend picker) ───────────────────────────── */
    .dg-setup-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .dg-setup-hint { color: var(--muted); font-size: 0.9em; line-height: 1.5; }
    .dg-friend-pick-list { display: flex; flex-direction: column; gap: 8px; }
    .dg-friend-pick-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; cursor: pointer; user-select: none;
    }
    .dg-friend-pick-row.selected { border-color: var(--accent); background: rgba(88,101,242,0.12); }
    .dg-pick-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); color: #fff; font-weight: 700;
      display: flex; align-items: center; justify-content: center; font-size: 0.9em;
    }
    .dg-pick-name { flex: 1; font-weight: 600; font-size: 0.95em; }
    .dg-pick-check {
      width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75em;
    }
    .dg-friend-pick-row.selected .dg-pick-check { background: var(--accent); border-color: var(--accent); }
    .dg-empty-state { color: var(--muted); font-size: 0.9em; text-align: center; padding: 30px 10px; }

    /* ── Active games browser (join a room someone else already started) ── */
    .dg-section-label {
      color: var(--muted); font-size: 0.72em; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-top: 6px;
    }
    .dg-public-room-list { display: flex; flex-direction: column; gap: 8px; }
    .dg-public-room-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px;
    }
    .dg-public-room-info { flex: 1; min-width: 0; }
    .dg-public-room-host { font-weight: 600; font-size: 0.92em; }
    .dg-public-room-meta { color: var(--muted); font-size: 0.78em; margin-top: 2px; }
    .dg-room-status-badge {
      font-size: 0.68em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em;
      padding: 2px 7px; border-radius: 20px; flex-shrink: 0;
    }
    .dg-room-status-badge.lobby   { background: rgba(88,101,242,0.16); color: var(--accent-lt); }
    .dg-room-status-badge.playing { background: rgba(59,165,93,0.16); color: var(--good); }
    .dg-join-room-btn {
      background: var(--accent); color: #fff; border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 0.84em; font-weight: 700; cursor: pointer; flex-shrink: 0;
      transition: background 0.15s;
    }
    .dg-join-room-btn:hover { background: #4752c4; }

    .dg-btn-primary {
      background: var(--accent); color: #fff; border: none; border-radius: 10px;
      padding: 13px; font-size: 0.98em; font-weight: 700; cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    .dg-btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .dg-btn-primary:not(:disabled):active { background: #4752c4; }

    /* ── Lobby screen ────────────────────────────────────────────── */
    .dg-lobby-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .dg-lobby-players { display: flex; flex-direction: column; gap: 8px; }
    .dg-lobby-player {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border-radius: 10px; padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .dg-lobby-player .dg-pick-avatar { background: var(--surface-2); color: var(--text); }
    .dg-lobby-player.host .dg-pick-avatar { background: var(--warn); color: #1e1f22; }
    .dg-lobby-tag { font-size: 0.72em; color: var(--muted); }
    .dg-hint { color: var(--muted); font-size: 0.88em; text-align: center; }
    .dg-invite-more-btn {
      background: none; border: 1px dashed var(--border); color: var(--accent-lt);
      border-radius: 10px; padding: 10px; font-size: 0.9em; font-weight: 600; cursor: pointer;
    }

    /* ── Play screen ─────────────────────────────────────────────── */
    .dg-play-screen { background: var(--bg); }
    .dg-play-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      height: 50px; flex-shrink: 0; padding: 0 14px;
      background: var(--surface); border-bottom: 1px solid var(--border);
      font-size: 0.85em;
    }
    .dg-round-info { color: var(--muted); font-weight: 600; }
    .dg-timer {
      font-weight: 800; font-size: 1.15em; color: var(--accent-lt);
      min-width: 32px; text-align: center;
    }
    .dg-timer.low { color: var(--danger); }
    .dg-drawer-info { color: var(--muted); text-align: right; }
    .dg-drawer-info strong { color: var(--text); }

    .dg-word-hint {
      text-align: center; padding: 10px 8px 4px;
      font-size: 1.3em; font-weight: 700; letter-spacing: 4px;
      min-height: 1.6em; flex-shrink: 0;
    }
    .dg-word-hint.is-word { color: var(--warn); letter-spacing: 1px; font-size: 1.15em; }

    .dg-canvas-wrap {
      position: relative; flex-shrink: 0;
      margin: 0 auto; width: 100%; max-width: 520px; padding: 0 12px;
    }
    #dgCanvas {
      width: 100%; height: auto; aspect-ratio: 4 / 3;
      background: #f5f5f7; border-radius: 12px; display: block;
      touch-action: none; box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }
    .dg-overlay {
      position: absolute; inset: 0 12px; border-radius: 12px;
      background: rgba(23,24,29,0.92); display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .dg-overlay-card { text-align: center; width: 100%; }
    .dg-overlay-title { font-size: 1.15em; font-weight: 800; margin-bottom: 12px; }
    .dg-overlay-detail { color: var(--muted); font-size: 0.9em; }
    .dg-word-choice-buttons { display: flex; flex-direction: column; gap: 8px; }
    .dg-word-choice-btn {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; padding: 12px; font-size: 1em; font-weight: 700; cursor: pointer;
    }
    .dg-word-choice-btn:active { background: var(--accent); }

    .dg-tools {
      display: flex; align-items: center; gap: 10px; flex-shrink: 0;
      padding: 10px 12px; max-width: 520px; width: 100%; margin: 0 auto;
    }
    .dg-colors { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; }
    .dg-color-swatch {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15);
      cursor: pointer; flex-shrink: 0;
    }
    .dg-color-swatch.active { border-color: #fff; transform: scale(1.15); }
    #brushSize { width: 70px; flex-shrink: 0; }
    .dg-tool-btn {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; width: 32px; height: 32px; font-size: 0.95em; cursor: pointer; flex-shrink: 0;
    }

    .dg-scoreboard {
      display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0;
      padding: 8px 12px; -webkit-overflow-scrolling: touch;
    }
    .dg-score-chip {
      display: flex; align-items: center; gap: 5px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
      padding: 4px 10px 4px 4px; font-size: 0.8em;
    }
    .dg-score-chip.drawing { border-color: var(--warn); }
    .dg-score-chip.disconnected { opacity: 0.4; }
    .dg-score-chip.got-it { border-color: var(--good); }
    .dg-score-avatar {
      width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center; font-size: 0.7em; font-weight: 700;
    }
    .dg-score-val { font-weight: 700; color: var(--accent-lt); }

    .dg-chat {
      flex: 1; overflow-y: auto; padding: 4px 14px; display: flex; flex-direction: column; gap: 5px;
      font-size: 0.86em; min-height: 0;
    }
    .dg-chat-line { color: var(--text); }
    .dg-chat-line .u { font-weight: 700; color: var(--accent-lt); }
    .dg-chat-line.correct { color: var(--good); font-weight: 700; }
    .dg-chat-line.system { color: var(--muted); font-style: italic; text-align: center; }

    .dg-guess-bar {
      display: flex; gap: 8px; flex-shrink: 0; padding: 10px 12px calc(10px + var(--safe-bottom));
      background: var(--surface); border-top: 1px solid var(--border);
    }
    #guessInput {
      flex: 1; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 20px; padding: 10px 16px; font-size: 0.95em; outline: none;
    }
    #guessInput:focus { border-color: var(--accent); }
    #guessSend {
      background: var(--accent); color: #fff; border: none; border-radius: 20px;
      padding: 0 18px; font-weight: 700; cursor: pointer;
    }
    #guessSend:disabled { opacity: 0.4; }

    /* ── End screen ──────────────────────────────────────────────── */
    #endScreen .dg-header { justify-content: center; }
    .dg-leaderboard { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 10px; }
    .dg-lb-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
    }
    .dg-lb-row:first-child { border-color: var(--warn); background: rgba(250,166,26,0.10); }
    .dg-lb-rank { font-weight: 800; font-size: 1.1em; color: var(--muted); width: 26px; }
    .dg-lb-row:first-child .dg-lb-rank { color: var(--warn); }
    .dg-lb-name { flex: 1; font-weight: 700; }
    .dg-lb-score { font-weight: 800; color: var(--accent-lt); }
    #endScreen .dg-btn-primary { margin: 0 16px calc(16px + var(--safe-bottom)); text-align: center; text-decoration: none; }

    /* ── Cross-page invite bar (shown while this page is open and a NEW
       invite arrives for a different room than the one we're in) ──────── */
    .dg-invite-bar {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + var(--safe-bottom));
      background: var(--surface); border: 1px solid var(--accent); border-radius: 12px;
      padding: 12px 14px; display: flex; align-items: center; gap: 10px; z-index: 50;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .dg-invite-bar span { flex: 1; font-size: 0.88em; }
    .dg-invite-bar button {
      border: none; border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: 0.85em; cursor: pointer;
    }
    .dg-invite-accept { background: var(--good); color: #fff; }
    .dg-invite-decline { background: var(--surface-2); color: var(--text); }

    #dg-toast {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      padding: 10px 18px; border-radius: 20px; font-size: 0.88em;
      opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s; z-index: 60;
      max-width: 90vw; text-align: center;
    }
    #dg-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div id="app">

  <div id="dgLoading" class="dg-loading"><div class="spinner"></div></div>

  <div id="dgAuthScreen" class="dg-center-screen hidden">
    <p>ამ თამაშისთვის საჭიროა შესვლა.</p>
    <a href="/dashboard.html">← დაბრუნება</a>
  </div>

  <!-- SETUP: pick friends to invite -->
  <div id="setupScreen" class="dg-screen">
    <header class="dg-header">
      <a href="/dashboard.html" class="dg-back">←</a>
      <div class="dg-title">🎨 დახატე და გამოიცანი</div>
    </header>
    <div class="dg-setup-body">
      <p class="dg-setup-hint">აირჩიე ონლაინ მოთამაშეები — ერთი ხატავს, დანარჩენები იცნობენ სიტყვას.</p>
      <div id="onlineFriendsList" class="dg-friend-pick-list"></div>
      <button id="createRoomBtn" class="dg-btn-primary" disabled>მოწვევის გაგზავნა</button>

      <div class="dg-section-label">🎮 აქტიური თამაშები — შემოუერთდი</div>
      <div id="publicRoomList" class="dg-public-room-list">
        <div class="dg-empty-state">ახლა არცერთი თამაში არ მიმდინარეობს.</div>
      </div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobbyScreen" class="dg-screen">
    <header class="dg-header">
      <a href="/dashboard.html" class="dg-back">←</a>
      <div class="dg-title">ლობი</div>
    </header>
    <div class="dg-lobby-body">
      <div id="lobbyPlayers" class="dg-lobby-players"></div>
      <div id="lobbyInviteMoreWrap"></div>
      <button id="startGameBtn" class="dg-btn-primary" style="display:none">თამაშის დაწყება</button>
      <p id="lobbyWaitHint" class="dg-hint"></p>
    </div>
  </div>

  <!-- PLAY -->
  <div id="playScreen" class="dg-screen dg-play-screen">
    <header class="dg-play-header">
      <div class="dg-round-info">რაუნდი <span id="roundNum">1</span>/<span id="roundTotal">—</span></div>
      <div class="dg-timer" id="dgTimer">—</div>
      <div class="dg-drawer-info">ხატავს: <strong id="drawerName">—</strong></div>
    </header>

    <div class="dg-word-hint" id="wordHint"></div>

    <div class="dg-canvas-wrap">
      <canvas id="dgCanvas" width="640" height="480"></canvas>
      <div id="wordChoiceOverlay" class="dg-overlay" style="display:none">
        <div class="dg-overlay-card">
          <div class="dg-overlay-title">აირჩიე სიტყვა</div>
          <div id="wordChoiceButtons" class="dg-word-choice-buttons"></div>
        </div>
      </div>
      <div id="roundEndOverlay" class="dg-overlay" style="display:none">
        <div class="dg-overlay-card">
          <div class="dg-overlay-title" id="roundEndWord"></div>
          <div id="roundEndDetail" class="dg-overlay-detail"></div>
        </div>
      </div>
    </div>

    <div id="drawTools" class="dg-tools" style="display:none">
      <div class="dg-colors" id="dgColors"></div>
      <input type="range" id="brushSize" min="2" max="22" value="5" title="ფუნჯის ზომა" />
      <button id="clearCanvasBtn" class="dg-tool-btn" title="გასუფთავება">🗑️</button>
    </div>

    <div class="dg-scoreboard" id="scoreboard"></div>
    <div class="dg-chat" id="dgChat"></div>

    <div class="dg-guess-bar" id="guessBar" style="display:none">
      <input id="guessInput" placeholder="დაწერე შენი ვარაუდი..." maxlength="60" autocomplete="off" />
      <button id="guessSend">გაგზავნა</button>
    </div>
  </div>

  <!-- END -->
  <div id="endScreen" class="dg-screen">
    <header class="dg-header"><div class="dg-title">თამაში დასრულდა 🏆</div></header>
    <div id="finalLeaderboard" class="dg-leaderboard"></div>
    <a href="/dashboard.html" class="dg-btn-primary">დაბრუნება დეშბორდზე</a>
  </div>

</div>

<div id="dgInviteBar" class="dg-invite-bar" style="display:none"></div>
<div id="dg-toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  (function () {
    function setAppHeight() {
      var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-height", h + "px");
    }
    setAppHeight();
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", setAppHeight);
      window.visualViewport.addEventListener("scroll", setAppHeight);
    }
    window.addEventListener("resize", setAppHeight);
    window.addEventListener("orientationchange", function () { setTimeout(setAppHeight, 200); });
  })();
</script>
<script>
(function () {
  "use strict";

  /* ── Helpers ─────────────────────────────────────────────────── */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  }
  function $(id) { return document.getElementById(id); }
  function showToast(msg, ms = 3000) {
    const t = $("dg-toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove("show"), ms);
  }
  function loadAuth() {
    try {
      return { token: localStorage.getItem("gaicani_auth_token"), username: localStorage.getItem("gaicani_auth_user") };
    } catch (_) { return {}; }
  }
  function getRoomParam() {
    const u = new URLSearchParams(window.location.search);
    return (u.get("room") || "").trim();
  }

  const { token, username } = loadAuth();
  const myUsernameLower = (username || "").toLowerCase();

  const elLoading = $("dgLoading");
  const elAuth    = $("dgAuthScreen");
  const screens   = { setup: $("setupScreen"), lobby: $("lobbyScreen"), play: $("playScreen"), end: $("endScreen") };

  if (!token || !username) {
    elLoading.classList.add("hidden");
    elAuth.classList.remove("hidden");
    Object.values(screens).forEach(s => s.classList.remove("visible"));
  }

  function showScreen(name) {
    Object.entries(screens).forEach(([k, el]) => el.classList.toggle("visible", k === name));
  }

  /* ── State ───────────────────────────────────────────────────── */
  let socket = null;
  let currentRoomId = getRoomParam() || null;
  let isHost = false;
  let isDrawer = false;
  let myFriendsLc = new Set();
  let selectedFriends = new Set();
  let onlineFriends = [];      // [{username}]
  let lastRoomPlayers = [];    // from drawGuess:room
  let timerInterval = null;
  let currentColor = "#000000";
  let currentSize = 5;
  let hasGuessedThisRound = false;

  const COLORS = ["#000000","#ffffff","#6b7280","#ef4444","#f97316","#eab308","#22c55e","#3b82f6","#6366f1","#a855f7","#ec4899","#78350f"];

  /* ── Canvas ──────────────────────────────────────────────────── */
  const canvas = $("dgCanvas");
  const ctx = canvas.getContext("2d");
  const LOGICAL_W = 640, LOGICAL_H = 480;

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = LOGICAL_W * dpr;
    canvas.height = LOGICAL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintCanvasBg();
  }
  function paintCanvasBg() {
    ctx.fillStyle = "#f5f5f7";
    ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  }
  sizeCanvas();
  window.addEventListener("resize", () => { /* CSS handles responsive scale; logical res stays fixed */ });

  function drawSegment(x1, y1, x2, y2, color, size) {
    ctx.strokeStyle = color;
    ctx.lineWidth = size;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
  function clearCanvasLocal() { paintCanvasBg(); }
  function replayStrokes(strokes) {
    clearCanvasLocal();
    (strokes || []).forEach(s => drawSegment(s.x1, s.y1, s.x2, s.y2, s.color, s.size));
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = LOGICAL_W / rect.width;
    const scaleY = LOGICAL_H / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
  }

  let drawingNow = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", (e) => {
    if (!isDrawer) return;
    drawingNow = true;
    const p = getCanvasPos(e);
    lastX = p.x; lastY = p.y;
    canvas.setPointerCapture(e.pointerId);
    // a dot on tap-without-drag
    drawSegment(p.x, p.y, p.x + 0.1, p.y, currentColor, currentSize);
    emitStroke({ x1: p.x, y1: p.y, x2: p.x + 0.1, y2: p.y, color: currentColor, size: currentSize });
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!isDrawer || !drawingNow) return;
    const p = getCanvasPos(e);
    drawSegment(lastX, lastY, p.x, p.y, currentColor, currentSize);
    emitStroke({ x1: lastX, y1: lastY, x2: p.x, y2: p.y, color: currentColor, size: currentSize });
    lastX = p.x; lastY = p.y;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => canvas.addEventListener(ev, () => { drawingNow = false; }));

  function emitStroke(stroke) {
    if (!socket || !currentRoomId) return;
    socket.emit("drawGuess:stroke", { roomId: currentRoomId, stroke });
  }

  /* ── Color/tool UI ───────────────────────────────────────────── */
  const colorsWrap = $("dgColors");
  COLORS.forEach((c, i) => {
    const sw = document.createElement("div");
    sw.className = "dg-color-swatch" + (i === 0 ? " active" : "");
    sw.style.background = c;
    sw.addEventListener("click", () => {
      currentColor = c;
      colorsWrap.querySelectorAll(".dg-color-swatch").forEach(el => el.classList.remove("active"));
      sw.classList.add("active");
    });
    colorsWrap.appendChild(sw);
  });
  $("brushSize").addEventListener("input", (e) => { currentSize = parseInt(e.target.value, 10) || 5; });
  $("clearCanvasBtn").addEventListener("click", () => {
    if (!isDrawer) return;
    clearCanvasLocal();
    socket.emit("drawGuess:clear", { roomId: currentRoomId });
  });

  /* ── Setup screen: friend picker ─────────────────────────────── */
  function renderOnlineFriends() {
    const list = $("onlineFriendsList");
    if (!onlineFriends.length) {
      list.innerHTML = `<div class="dg-empty-state">ახლა არავინ არის ონლაინ.<br><small>დაელოდე ვინმეს შემოსვლას.</small></div>`;
      $("createRoomBtn").disabled = true;
      return;
    }
    list.innerHTML = onlineFriends.map(f => `
      <div class="dg-friend-pick-row${selectedFriends.has(f.username.toLowerCase()) ? " selected" : ""}" data-u="${esc(f.username)}">
        <div class="dg-pick-avatar">${esc(f.username).charAt(0).toUpperCase()}</div>
        <div class="dg-pick-name">${esc(f.username)}</div>
        ${myFriendsLc.has(f.username.toLowerCase()) ? '<span class="dg-lobby-tag">მეგობარი</span>' : ""}
        <div class="dg-pick-check">✓</div>
      </div>`).join("");
    list.querySelectorAll(".dg-friend-pick-row").forEach(row => {
      row.addEventListener("click", () => {
        const lc = row.dataset.u.toLowerCase();
        if (selectedFriends.has(lc)) selectedFriends.delete(lc); else selectedFriends.add(lc);
        row.classList.toggle("selected");
        $("createRoomBtn").disabled = selectedFriends.size === 0;
      });
    });
  }

  $("createRoomBtn").addEventListener("click", () => {
    const usernames = onlineFriends.filter(f => selectedFriends.has(f.username.toLowerCase())).map(f => f.username);
    if (!usernames.length) return;
    socket.emit("drawGuess:invite", { toUsernames: usernames });
  });

  /* ── Active-games browser: join a room someone else already started ── */
  function renderPublicRooms(rooms) {
    const list = $("publicRoomList");
    if (!rooms || !rooms.length) {
      list.innerHTML = `<div class="dg-empty-state">ახლა არცერთი თამაში არ მიმდინარეობს.</div>`;
      return;
    }
    list.innerHTML = rooms.map(r => `
      <div class="dg-public-room-row" data-room="${esc(r.roomId)}">
        <div class="dg-public-room-info">
          <div class="dg-public-room-host">🎨 ${esc(r.hostUsername)}-ის ოთახი</div>
          <div class="dg-public-room-meta">${r.playerCount}/${r.maxPlayers} მოთამაშე${r.status === "playing" ? ` · რაუნდი ${r.roundNumber}` : ""}</div>
        </div>
        <span class="dg-room-status-badge ${r.status}">${r.status === "playing" ? "მიმდინარეობს" : "ლობი"}</span>
        <button class="dg-join-room-btn">შემოერთება</button>
      </div>`).join("");
    list.querySelectorAll(".dg-public-room-row").forEach(row => {
      row.querySelector(".dg-join-room-btn").addEventListener("click", () => {
        socket.emit("drawGuess:join", { roomId: row.dataset.room });
      });
    });
  }

  /* ── Lobby rendering ─────────────────────────────────────────── */
  function renderLobby(state) {
    lastRoomPlayers = state.players || [];
    isHost = state.hostUsername.toLowerCase() === myUsernameLower;

    $("lobbyPlayers").innerHTML = lastRoomPlayers.map(p => `
      <div class="dg-lobby-player${p.username.toLowerCase() === state.hostUsername.toLowerCase() ? " host" : ""}">
        <div class="dg-pick-avatar">${esc(p.username).charAt(0).toUpperCase()}</div>
        <div class="dg-pick-name">${esc(p.username)}</div>
        ${p.username.toLowerCase() === state.hostUsername.toLowerCase() ? '<span class="dg-lobby-tag">მასპინძელი</span>' : ""}
      </div>`).join("");

    $("startGameBtn").style.display = isHost ? "block" : "none";
    $("startGameBtn").disabled = lastRoomPlayers.length < 2;
    $("lobbyWaitHint").textContent = isHost
      ? (lastRoomPlayers.length < 2 ? "დაელოდე მინიმუმ 1 მეგობრის შემოერთებას." : "")
      : "მასპინძლის მოლოდინში...";

    const inviteWrap = $("lobbyInviteMoreWrap");
    if (isHost) {
      inviteWrap.innerHTML = `<button class="dg-invite-more-btn" id="inviteMoreBtn">+ მეტი მეგობრის მოწვევა</button>`;
      $("inviteMoreBtn").onclick = () => {
        const inRoom = new Set(lastRoomPlayers.map(p => p.username.toLowerCase()));
        const available = onlineFriends.filter(f => !inRoom.has(f.username.toLowerCase()));
        if (!available.length) { showToast("ყველა ონლაინ მეგობარი უკვე ოთახშია."); return; }
        socket.emit("drawGuess:invite", { toUsernames: available.map(f => f.username) });
        showToast("მოწვევა გაიგზავნა.");
      };
    } else {
      inviteWrap.innerHTML = "";
    }
  }

  /* ── Play screen rendering ───────────────────────────────────── */
  function renderScoreboard(players) {
    $("scoreboard").innerHTML = (players || []).map(p => {
      const classes = ["dg-score-chip"];
      if (p.isDrawer) classes.push("drawing");
      if (!p.connected) classes.push("disconnected");
      return `<div class="${classes.join(" ")}">
        <span class="dg-score-avatar">${esc(p.username).charAt(0).toUpperCase()}</span>
        <span>${esc(p.username)}${p.isDrawer ? " ✏️" : ""}</span>
        <span class="dg-score-val">${p.score}</span>
      </div>`;
    }).join("");
  }

  function appendChat({ username, text, correct, points }) {
    const chat = $("dgChat");
    const line = document.createElement("div");
    if (correct) {
      line.className = "dg-chat-line correct";
      line.textContent = `🎉 ${username} გამოიცნო! (+${points})`;
    } else if (username) {
      line.className = "dg-chat-line";
      line.innerHTML = `<span class="u">${esc(username)}:</span> ${esc(text)}`;
    } else {
      line.className = "dg-chat-line system";
      line.textContent = text;
    }
    chat.appendChild(line);
    chat.scrollTop = chat.scrollHeight;
  }
  function clearChat() { $("dgChat").innerHTML = ""; }

  function startTimer(endsAt) {
    clearInterval(timerInterval);
    function tick() {
      const secs = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
      const el = $("dgTimer");
      el.textContent = secs;
      el.classList.toggle("low", secs <= 15);
      if (secs <= 0) clearInterval(timerInterval);
    }
    tick();
    timerInterval = setInterval(tick, 250);
  }

  function beginRound({ roundNumber, totalRounds, drawerUsername, isDrawer: iAmDrawer, word, wordLength, endsAt }) {
    isDrawer = iAmDrawer;
    hasGuessedThisRound = false;
    $("roundNum").textContent = roundNumber;
    $("roundTotal").textContent = totalRounds;
    $("drawerName").textContent = drawerUsername;
    $("wordChoiceOverlay").style.display = "none";
    $("roundEndOverlay").style.display = "none";
    clearCanvasLocal();
    clearChat();
    startTimer(endsAt);

    const hint = $("wordHint");
    if (iAmDrawer) {
      hint.textContent = word;
      hint.classList.add("is-word");
    } else {
      hint.textContent = Array(wordLength || 0).fill("_").join(" ");
      hint.classList.remove("is-word");
    }

    $("drawTools").style.display = iAmDrawer ? "flex" : "none";
    $("guessBar").style.display = iAmDrawer ? "none" : "flex";
    $("guessInput").disabled = false;
    $("guessSend").disabled = false;
    $("guessInput").value = "";
  }

  /* ── Guess input ─────────────────────────────────────────────── */
  function sendGuess() {
    const input = $("guessInput");
    const text = input.value.trim();
    if (!text || hasGuessedThisRound) return;
    socket.emit("drawGuess:guess", { roomId: currentRoomId, text });
    input.value = "";
  }
  $("guessSend").addEventListener("click", sendGuess);
  $("guessInput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendGuess(); });

  /* ── End screen ──────────────────────────────────────────────── */
  function renderEnd(scores) {
    $("finalLeaderboard").innerHTML = scores.map((s, i) => `
      <div class="dg-lb-row">
        <div class="dg-lb-rank">${i + 1}</div>
        <div class="dg-lb-name">${esc(s.username)}${i === 0 ? " 🏆" : ""}</div>
        <div class="dg-lb-score">${s.score}</div>
      </div>`).join("");
  }

  /* ── Cross-room invite bar (while already on this page) ───────── */
  function showInviteBar(roomId, fromUsername) {
    const bar = $("dgInviteBar");
    bar.style.display = "flex";
    bar.innerHTML = `
      <span>🎨 <strong>${esc(fromUsername)}</strong> გპატიჟებს თამაშში</span>
      <button class="dg-invite-accept">✅</button>
      <button class="dg-invite-decline">❌</button>`;
    bar.querySelector(".dg-invite-accept").onclick = () => {
      bar.style.display = "none";
      window.location.href = "/draw-guess.html?room=" + encodeURIComponent(roomId);
    };
    bar.querySelector(".dg-invite-decline").onclick = () => {
      bar.style.display = "none";
      socket.emit("drawGuess:declineInvite", { roomId });
    };
  }

  /* ── Boot ────────────────────────────────────────────────────── */
  function init() {
    if (!token || !username) return;

    socket = io();
    socket.on("connect", () => socket.emit("auth:token", { token }));

    socket.on("auth:authenticated", ({ friends }) => {
      myFriendsLc = new Set((friends || []).map(f => f.toLowerCase()));
      elLoading.classList.add("hidden");
      socket.emit("users:listOnline");
      socket.emit("drawGuess:listPublicRooms");

      if (currentRoomId) {
        showScreen("lobby");
        socket.emit("drawGuess:join", { roomId: currentRoomId });
      } else {
        showScreen("setup");
      }
    });

    socket.on("auth:invalid", () => { window.location.href = "/"; });

    socket.on("users:onlineList", ({ users }) => {
      onlineFriends = (users || []).filter(u => u.username.toLowerCase() !== myUsernameLower);
      renderOnlineFriends();
    });
    socket.on("users:onlineChanged", () => socket.emit("users:listOnline"));

    socket.on("drawGuess:publicRooms", (rooms) => renderPublicRooms(rooms));

    socket.on("drawGuess:playerJoined", ({ username: who }) => {
      showToast(`${who} შემოუერთდა თამაშს — მალე მასაც დაუწყდება ხატვის რიგი.`);
    });

    socket.on("drawGuess:invited", ({ roomId, fromUsername }) => {
      showInviteBar(roomId, fromUsername);
    });

    socket.on("drawGuess:inviteSent", ({ invited, cooldown }) => {
      if (invited && invited.length) showToast(`მოწვევა გაეგზავნა: ${invited.join(", ")}`);
      if (cooldown && cooldown.length) showToast(`${cooldown.join(", ")} ცოტა ხნის წინ უარი განაცხადა — სცადე მოგვიანებით.`);
      if ((!invited || !invited.length) && (!cooldown || !cooldown.length)) showToast("ვერავინ მოწვეულ იქნა — შეამოწმე ონლაინ არიან თუ არა.");
    });

    socket.on("drawGuess:inviteDeclined", ({ username: who }) => {
      showToast(`${who}-მ უარყო მოწვევა.`);
    });

    socket.on("drawGuess:room", (state) => {
      currentRoomId = state.roomId;
      history.replaceState(null, "", "/draw-guess.html?room=" + encodeURIComponent(state.roomId));
      if (state.status === "lobby") {
        showScreen("lobby");
        renderLobby(state);
      } else if (state.status === "playing") {
        showScreen("play");
        renderScoreboard(state.players);
        if (!state.wordLength) {
          // Between rounds (word not yet picked) — make sure no stale overlay lingers.
          $("roundEndOverlay").style.display = "none";
        }
      }
    });

    socket.on("drawGuess:error", ({ message }) => {
      showToast(message);
      if (!lastRoomPlayers.length) { showScreen("setup"); }
    });

    $("startGameBtn").addEventListener("click", () => {
      socket.emit("drawGuess:start", { roomId: currentRoomId });
    });

    socket.on("drawGuess:chooseWord", ({ choices }) => {
      showScreen("play");
      $("roundEndOverlay").style.display = "none";
      $("wordChoiceOverlay").style.display = "flex";
      $("wordChoiceButtons").innerHTML = choices.map(w => `<button class="dg-word-choice-btn" data-w="${esc(w)}">${esc(w)}</button>`).join("");
      $("wordChoiceButtons").querySelectorAll(".dg-word-choice-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          socket.emit("drawGuess:pickWord", { roomId: currentRoomId, word: btn.dataset.w });
          $("wordChoiceOverlay").style.display = "none";
        }, { once: true });
      });
    });

    socket.on("drawGuess:roundStart", (payload) => {
      showScreen("play");
      beginRound(payload);
    });

    socket.on("drawGuess:roundSync", (payload) => {
      if (!payload) return;
      showScreen("play");
      isDrawer = payload.isDrawer;
      hasGuessedThisRound = !!payload.alreadyGuessed;
      $("roundNum").textContent = payload.roundNumber;
      $("roundTotal").textContent = payload.totalRounds;
      $("drawerName").textContent = payload.drawerUsername;
      startTimer(payload.endsAt);
      const hint = $("wordHint");
      if (payload.isDrawer) { hint.textContent = payload.word; hint.classList.add("is-word"); }
      else { hint.textContent = Array(payload.wordLength || 0).fill("_").join(" "); hint.classList.remove("is-word"); }
      $("drawTools").style.display = payload.isDrawer ? "flex" : "none";
      $("guessBar").style.display = payload.isDrawer ? "none" : "flex";
      if (payload.strokes && payload.strokes.length) replayStrokes(payload.strokes);
    });

    socket.on("drawGuess:stroke", ({ stroke }) => {
      drawSegment(stroke.x1, stroke.y1, stroke.x2, stroke.y2, stroke.color, stroke.size);
    });
    socket.on("drawGuess:clear", () => clearCanvasLocal());

    socket.on("drawGuess:chat", (payload) => appendChat(payload));

    socket.on("drawGuess:youGuessed", ({ points, word }) => {
      hasGuessedThisRound = true;
      $("guessInput").disabled = true;
      $("guessSend").disabled = true;
      showToast(`სწორია! +${points} ქულა 🎉`);
    });

    socket.on("drawGuess:scores", ({ scores }) => {
      lastRoomPlayers = lastRoomPlayers.map(p => {
        const s = scores.find(x => x.username === p.username);
        return s ? { ...p, score: s.score } : p;
      });
      renderScoreboard(lastRoomPlayers);
    });

    socket.on("drawGuess:roundEnd", ({ word, drawerUsername, drawerPoints, correctCount, scores, reason }) => {
      clearInterval(timerInterval);
      $("guessBar").style.display = "none";
      $("drawTools").style.display = "none";
      const overlay = $("roundEndOverlay");
      overlay.style.display = "flex";
      if (word) {
        $("roundEndWord").textContent = `სიტყვა იყო: ${word}`;
        $("roundEndDetail").textContent = `${correctCount} მოთამაშემ გამოიცნო · ${drawerUsername}-მა მიიღო +${drawerPoints}`;
      } else {
        $("roundEndWord").textContent = "რაუნდი გამოტოვებულია";
        $("roundEndDetail").textContent = `${drawerUsername} გათიშული იყო.`;
      }
      lastRoomPlayers = lastRoomPlayers.map(p => {
        const s = scores.find(x => x.username === p.username);
        return s ? { ...p, score: s.score, isDrawer: false } : p;
      });
      renderScoreboard(lastRoomPlayers);
    });

    socket.on("drawGuess:gameEnd", ({ scores }) => {
      clearInterval(timerInterval);
      showScreen("end");
      renderEnd(scores);
    });
  }

  init();
})();
</script>
</body>
</html>
